services:
  temp-humidity-sim:
    build: ./simulators
    entrypoint: ["/usr/local/bin/temp-humidity-sim"]
    restart: unless-stopped
    environment:
      MODBUS_ADDR: 0.0.0.0:5021
      ADMIN_ADDR: 0.0.0.0:5121
    ports:
      - "127.0.0.1:5121:5121"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5121/state"]
      interval: 5s
      timeout: 3s
      retries: 5

  relay-sim:
    build: ./simulators
    entrypoint: ["/usr/local/bin/relay-sim"]
    restart: unless-stopped
    environment:
      MODBUS_ADDR: 0.0.0.0:5022
      ADMIN_ADDR: 0.0.0.0:5122
    ports:
      - "127.0.0.1:5122:5122"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5122/state"]
      interval: 5s
      timeout: 3s
      retries: 5

  thermocouple-sim:
    build: ./simulators
    entrypoint: ["/usr/local/bin/thermocouple-sim"]
    restart: unless-stopped
    environment:
      MODBUS_ADDR: 0.0.0.0:5023
      ADMIN_ADDR: 0.0.0.0:5123
    ports:
      - "127.0.0.1:5123:5123"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5123/state"]
      interval: 5s
      timeout: 3s
      retries: 5

  speed-pwm-sim:
    build: ./simulators
    entrypoint: ["/usr/local/bin/speed-pwm-sim"]
    restart: unless-stopped
    environment:
      MODBUS_ADDR: 0.0.0.0:5024
      ADMIN_ADDR: 0.0.0.0:5124
    ports:
      - "127.0.0.1:5124:5124"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5124/state"]
      interval: 5s
      timeout: 3s
      retries: 5

  remote-reset-sim:
    build: ./simulators
    entrypoint: ["/usr/local/bin/remote-reset-sim"]
    restart: unless-stopped
    environment:
      TCP_ADDR: 0.0.0.0:9001
      TEMP_HUMIDITY_ADMIN_URL: http://temp-humidity-sim:5121
      RELAY_ADMIN_URL: http://relay-sim:5122
      THERMOCOUPLE_ADMIN_URL: http://thermocouple-sim:5123
      SPEED_PWM_ADMIN_URL: http://speed-pwm-sim:5124
      RESET_DURATION: 5s
    ports:
      - "127.0.0.1:${SIM_ADMIN_PORT:-5021}:9001"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      temp-humidity-sim:
        condition: service_healthy
      relay-sim:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (copy .env.example)}
      VIEWER_USERNAME: ${VIEWER_USERNAME:-viewer}
      VIEWER_PASSWORD: ${VIEWER_PASSWORD:?set VIEWER_PASSWORD in .env}
      OPERATOR_USERNAME: ${OPERATOR_USERNAME:-operator}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:?set OPERATOR_PASSWORD in .env}
      MODBUS_URL: tcp://temp-humidity-sim:5021
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend-data:/data

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"

volumes:
  backend-data:
  prometheus-data:
  grafana-data: